interproscan_path: "software/interproscan/interproscan.sh"
pfam_clan_url: ftp://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-A.clans.tsv.gz
pfam_clan_desc_url: https://ftp.ebi.ac.uk/pub/databases/Pfam/current_release/Pfam-C.gz
nls_chunks: 50
nls_java_memory: 2g
# Off until its run time is measured on a full run. Turn it on with repeat_masker=True
repeat_masker: False
# Dfam families RepeatMasker searches: curated (90 MB download) or all, curated and uncurated (4.2 GB)
repeatmasker_dfam: curated
# A fixed Dfam release, so results do not change when Dfam publishes a new one. dfam_prefix is the start of its file names
dfam_url: https://www.dfam.org/releases/Dfam_4.0/families/FamDB
dfam_prefix: dfam40

