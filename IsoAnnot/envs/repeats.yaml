name: repeats
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10    
  - perl=5.32      
  - rmblast=2.17.0
  - trf=4.09.1     
  - hmmer=3.4
  # RepeatMasker itself is installed by the install_repeatmasker rule; famdb.py reads Dfam for it
  - famdb=3.0.0
  - pandas
  - numpy
  - gsl=2.7
  - openmpi
  - curl
  - entrez-direct
  - pip
